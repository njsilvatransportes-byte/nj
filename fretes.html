<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lançamento de Fretes</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body{background:#f6f8fb}
    .topbar{position:sticky;top:0;z-index:1000;background:#fff;border-bottom:1px solid #e5e7eb;padding:12px 36px;display:flex;justify-content:flex-start;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
    .topbar a{display:inline-flex;align-items:center;text-decoration:none;padding:9px 14px;border-radius:7px;font-weight:700;background:#eef2f6;color:#1f2937}
    .page{padding:36px}
    .card{max-width:none;padding:28px}
    .form-stack{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
    .form-stack textarea{min-height:90px}
    .form-actions{grid-column:1/-1;display:flex;gap:8px;align-items:center;margin-top:4px}
    .form-actions button{padding:9px 14px}
    #cancel-edit{display:none}
    .actions{display:flex;gap:8px;align-items:center}
    .actions button{border:0;background:transparent;font-weight:700;cursor:pointer;padding:5px 7px}
    .actions .edit{color:var(--blue)}
    .actions .delete{color:#b42318}
    #msg{min-height:22px;margin:12px 0 0;font-weight:700}
    @media(max-width:700px){
      .form-stack{grid-template-columns:1fr}
      .topbar{padding:10px 16px}
      .page{padding:20px 16px}
      .form-actions{grid-column:1;flex-wrap:wrap}
      .form-actions button{flex:1;min-width:170px}
      th,td{padding:12px}
    }
  </style>
</head>
<body>
  <nav class="topbar">
    <a href="index.html">&larr; Voltar para a página inicial</a>
  </nav>

  <main class="page">
    <section class="card">
      <p class="eyebrow">LANÇAMENTOS</p>
      <h2 id="form-title">Lançamento de frete</h2>

      <form id="f" class="form-stack">
        <input type="hidden" name="id" id="frete-id">

        <label>Data
          <input name="date" type="date" required>
        </label>

        <label>Motorista
          <select name="driver_id" id="d" required></select>
        </label>

        <label>Placa
          <select name="vehicle_id" id="v" required></select>
        </label>

        <label>Cliente
          <select name="client_id" id="c" required></select>
        </label>

        <label>Destino
          <input name="destination" required oninput="this.value=this.value.toUpperCase()">
        </label>

        <label>Frete
          <input name="freight" type="number" step=".01" required>
        </label>

        <label>Pedágios
          <input name="tolls" type="number" step=".01" value="0">
        </label>

        <label>SEST/SENAT
          <input name="sest_senat" type="number" step=".01" value="0">
        </label>

        <label>IRRF
          <input name="irrf" type="number" step=".01" value="0">
        </label>

        <label>INSS
          <input name="inss" type="number" step=".01" value="0">
        </label>

        <div class="form-actions">
          <button id="save-button" class="button button-primary" type="submit">Salvar lançamento</button>
          <button id="cancel-edit" class="button button-secondary" type="button">Cancelar edição</button>
        </div>
      </form>

      <p id="msg"></p>

      <hr>

      <h2>Lançamentos cadastrados</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Data</th>
              <th>Motorista</th>
              <th>Placa</th>
              <th>Cliente</th>
              <th>Destino</th>
              <th>Frete</th>
              <th>Pedágios</th>
              <th>SEST/SENAT</th>
              <th>IRRF</th>
              <th>INSS</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="list"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const q = s => document.querySelector(s);
    let fretes = [];

    function esc(value){
      return String(value ?? '').replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

    function money(value){
      if(value === null || value === undefined || value === '') return '-';
      return 'R$ ' + Number(value).toLocaleString('pt-BR',{
        minimumFractionDigits:2,
        maximumFractionDigits:2
      });
    }

    function fmtDate(v){
      const s = String(v||'').slice(0,10);
      if(!s) return '-';
      const [y,m,d] = s.split('-');
      return `${d}/${m}/${y}`;
    }

    function showMessage(text, error=false){
      q('#msg').textContent = text;
      q('#msg').style.color = error ? '#b42318' : '#187444';
    }

    async function l(u,e,t){
      const response = await fetch('/api/'+u);
      if(!response.ok) throw new Error('Não foi possível carregar os dados.');
      const a = await response.json();
      q(e).innerHTML =
        '<option value="">Selecione</option>' +
        a.map(x => '<option value="'+esc(x.id)+'">'+esc(x[t])+'</option>').join('');
    }

    async function load(){
      const response = await fetch('/api/freight_entries');
      if(!response.ok) throw new Error('Não foi possível carregar os lançamentos de frete.');

      fretes = await response.json();

      q('#list').innerHTML = fretes.map(x => `
        <tr>
          <td>${fmtDate(x.date)}</td>
          <td>${esc(x.driver_name || '-')}</td>
          <td>${esc(x.plate || '-')}</td>
          <td>${esc(x.client_name || '-')}</td>
          <td>${esc(x.destination || '-')}</td>
          <td>${money(x.freight)}</td>
          <td>${money(x.tolls)}</td>
          <td>${money(x.sest_senat)}</td>
          <td>${money(x.irrf)}</td>
          <td>${money(x.inss)}</td>
          <td class="actions">
            <button class="edit" type="button" onclick="editFrete('${esc(x.id)}')">Editar</button>
            <button class="delete" type="button" onclick="deleteFrete('${esc(x.id)}')">Excluir</button>
          </td>
        </tr>
      `).join('');
    }

    function startEdit(item){
      q('#frete-id').value = item.id;

      for(const el of q('#f').elements){
        if(!el.name || el.name === 'id') continue;
        if(item[el.name] !== undefined && item[el.name] !== null){
          el.value = item[el.name];
        }
      }

      q('#form-title').textContent = 'Editar lançamento de frete';
      q('#save-button').textContent = 'Salvar alterações';
      q('#cancel-edit').style.display = 'inline-block';
      showMessage('Editando o lançamento selecionado.');
      window.scrollTo({top:0,behavior:'smooth'});
    }

    window.editFrete = function(id){
      const item = fretes.find(x => String(x.id) === String(id));
      if(item) startEdit(item);
    };

    function cancelEditFrete(){
      q('#f').reset();
      q('#frete-id').value = '';
      q('#form-title').textContent = 'Lançamento de frete';
      q('#save-button').textContent = 'Salvar lançamento';
      q('#cancel-edit').style.display = 'none';
      showMessage('');
    }

    q('#cancel-edit').onclick = cancelEditFrete;

    window.deleteFrete = async function(id){
      const item = fretes.find(x => String(x.id) === String(id));
      if(!item) return;

      const descricao =
        (item.date || '') + ' - ' +
        (item.driver_name || 'sem motorista') + ' - ' +
        (item.destination || 'sem destino');

      if(!confirm('Tem certeza que deseja excluir este frete?\n\n' + descricao)) return;

      try{
        const s = JSON.parse(localStorage.getItem('nj_session')||'null');
        const response = await fetch(
          '/api/freight_entries/' + encodeURIComponent(id),
          {method:'DELETE', headers: s ? {'X-User-Id':s.id, 'X-User-Name':encodeURIComponent(s.name)} : {}}
        );

        const data = await response.json().catch(() => ({}));
        if(!response.ok){
          throw new Error(data.error || 'Não foi possível excluir o frete.');
        }

        if(String(q('#frete-id').value) === String(id)){
          cancelEditFrete();
        }

        showMessage('Frete excluído com sucesso.');
        await load();
      }catch(error){
        showMessage(error.message, true);
      }
    };

    q('#f').onsubmit = async e => {
      e.preventDefault();

      const id = q('#frete-id').value;
      const data = Object.fromEntries(new FormData(e.target));
      delete data.id;

      try{
        const s = JSON.parse(localStorage.getItem('nj_session')||'null');
        const response = await fetch(
          '/api/freight_entries' + (id ? '/' + encodeURIComponent(id) : ''),
          {
            method: id ? 'PUT' : 'POST',
            headers: {'Content-Type':'application/json', ...(s ? {'X-User-Id':s.id, 'X-User-Name':encodeURIComponent(s.name)} : {})},
            body: JSON.stringify(data)
          }
        );

        const result = await response.json().catch(() => ({}));
        if(!response.ok){
          throw new Error(
            result.error ||
            (id ? 'Não foi possível atualizar o frete.' : 'Não foi possível salvar o frete.')
          );
        }

        cancelEditFrete();
        showMessage(id ? 'Frete atualizado com sucesso!' : 'Frete salvo com sucesso!');
        await load();
      }catch(error){
        showMessage(error.message, true);
      }
    };

    Promise.all([
      l('drivers','#d','name'),
      l('vehicles','#v','plate'),
      l('clients','#c','name'),
      load()
    ]).catch(error => showMessage(error.message, true));
  </script>
<script src="timeout.js"></script></body>
</html>
