<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lançamento de Fretes</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body{background:#f6f8fb}
    .topbar{position:sticky;top:0;z-index:1000;background:#fff;border-bottom:1px solid #e5e7eb;padding:12px 36px;display:flex;justify-content:flex-start;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
    .topbar a{display:inline-flex;align-items:center;text-decoration:none;padding:9px 14px;border-radius:7px;font-weight:700;background:#eef2f6;color:#1f2937}
    .page{padding:36px}
    .card{max-width:none;padding:28px}
    .form-stack{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
    .form-col{display:flex;flex-direction:column;gap:16px}
    .form-stack textarea{min-height:90px}
    .form-actions{grid-column:1/-1;display:flex;gap:8px;align-items:center;margin-top:8px}
    .form-actions button{padding:9px 14px}
    #cancel-edit{display:none}
    .actions{display:flex;gap:8px;align-items:center}
    .actions button{border:0;background:transparent;font-weight:700;cursor:pointer;padding:5px 7px}
    .actions .edit{color:var(--blue)}
    .actions .delete{color:#b42318}
    #msg{min-height:22px;margin:12px 0 0;font-weight:700}
    @media(max-width:700px){
      .form-stack{grid-template-columns:1fr}
      .topbar{padding:10px 16px}
      .page{padding:20px 16px}
      .form-actions{grid-column:1;flex-wrap:wrap}
      .form-actions button{flex:1;min-width:170px}
      th,td{padding:12px}
    }
  </style>
</head>
<body>
  <nav class="topbar">
    <a href="index.html">&larr; Voltar para a página inicial</a>
  </nav>

  <main class="page">
    <section class="card">
      <p class="eyebrow">LANÇAMENTOS</p>
      <h2 id="form-title">Lançamento de frete</h2>

      <form id="f" class="form-stack">
        <input type="hidden" name="id" id="frete-id">

        <!-- Coluna 1: Dados do Transporte / Identificação -->
        <div class="form-col">
          <label>Data
            <input name="date" type="date" required>
          </label>

          <label>CTRC <small style="font-weight:normal;color:#6b7280;">(Contrato de Transporte Rodoviário)</small>
            <input name="ctrc" id="ctrc" placeholder="Ex: 001234" required autocomplete="off">
          </label>

          <label>Placa
            <select name="vehicle_id" id="v" required></select>
          </label>

          <label>Motorista
            <select name="driver_id" id="d" required></select>
          </label>

          <label>Cliente
            <select name="client_id" id="c" required></select>
          </label>

          <label>Destino
            <input name="destination" required oninput="this.value=this.value.toUpperCase()">
          </label>
        </div>

        <!-- Coluna 2: Valores Financeiros e Deduções -->
        <div class="form-col">
          <label>Frete
            <input name="freight" type="number" step=".01" required>
          </label>

          <label>Pedágios
            <input name="tolls" type="number" step=".01" value="0">
          </label>

          <label>INSS
            <input name="inss" type="number" step=".01" value="0">
          </label>

          <label>SEST/SENAT
            <input name="sest_senat" type="number" step=".01" value="0">
          </label>

          <label>IRRF
            <input name="irrf" type="number" step=".01" value="0">
          </label>
        </div>

        <div class="form-actions">
          <button id="save-button" class="button button-primary" type="submit">Salvar lançamento</button>
          <button id="cancel-edit" class="button button-secondary" type="button">Cancelar edição</button>
        </div>
      </form>

      <p id="msg"></p>

      <hr>

      <h2>Lançamentos cadastrados</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Data</th>
              <th>CTRC</th>
              <th>Placa</th>
              <th>Motorista</th>
              <th>Cliente</th>
              <th>Destino</th>
              <th>Frete</th>
              <th>Pedágios</th>
              <th>INSS</th>
              <th>SEST/SENAT</th>
              <th>IRRF</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="list"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const q = s => document.querySelector(s);
    let fretes = [];

    function esc(value){
      return String(value ?? '').replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

    function money(value){
      if(value === null || value === undefined || value === '') return '-';
      return 'R$ ' + Number(value).toLocaleString('pt-BR',{
        minimumFractionDigits:2,
        maximumFractionDigits:2
      });
    }

    function fmtDate(v){
      const s = String(v||'').slice(0,10);
      if(!s) return '-';
      const [y,m,d] = s.split('-');
      return `${d}/${m}/${y}`;
    }

    function showMessage(text, error=false){
      q('#msg').textContent = text;
      q('#msg').style.color = error ? '#b42318' : '#187444';
    }

    async function l(u,e,t){
      const response = await fetch('/api/'+u);
      if(!response.ok) throw new Error('Não foi possível carregar os dados.');
      const a = await response.json();
      q(e).innerHTML =
        '<option value="">Selecione</option>' +
        a.map(x => '<option value="'+esc(x.id)+'">'+esc(x[t])+'</option>').join('');
    }

    async function load(){
      const response = await fetch('/api/freight_entries');
      if(!response.ok) throw new Error('Não foi possível carregar os lançamentos de frete.');

      fretes = await response.json();

      q('#list').innerHTML = fretes.map(x => `
        <tr>
          <td>${fmtDate(x.date)}</td>
          <td><strong>${esc(x.ctrc || '-')}</strong></td>
          <td>${esc(x.plate || '-')}</td>
          <td>${esc(x.driver_name || '-')}</td>
          <td>${esc(x.client_name || '-')}</td>
          <td>${esc(x.destination || '-')}</td>
          <td>${money(x.freight)}</td>
          <td>${money(x.tolls)}</td>
          <td>${money(x.inss)}</td>
          <td>${money(x.sest_senat)}</td>
          <td>${money(x.irrf)}</td>
          <td class="actions">
            <button class="edit" type="button" onclick="editFrete('${esc(x.id)}')">Editar</button>
            <button class="delete" type="button" onclick="deleteFrete('${esc(x.id)}')">Excluir</button>
          </td>
        </tr>
      `).join('');
    }

    function checkCtrcDuplicity(strictMode = false){
      const ctrcEl = q('#ctrc');
      const val = ctrcEl.value.trim().toUpperCase();
      const currentId = q('#frete-id').value;

      if(!val){
        ctrcEl.setCustomValidity('');
        ctrcEl.style.borderColor = '';
        ctrcEl.style.backgroundColor = '';
        ctrcEl.style.color = '';
        if(q('#msg').textContent.includes('CTRC')) showMessage('');
        return true;
      }

      const duplicate = fretes.find(x =>
        String(x.ctrc || '').trim().toUpperCase() === val &&
        String(x.id) !== String(currentId)
      );

      if(duplicate){
        const info = `CTRC "${val}" já cadastrado em ${fmtDate(duplicate.date)} (${duplicate.driver_name || 'Motorista'} - ${duplicate.plate || 'Placa'})!`;
        ctrcEl.style.borderColor = '#b42318';
        ctrcEl.style.backgroundColor = '#fff5f5';
        ctrcEl.style.color = '#b42318';
        ctrcEl.setCustomValidity(info);
        showMessage('❌ ' + info + ' Não é permitido lançamentos com CTRC duplicado.', true);

        if(strictMode){
          alert(`❌ CTRC JÁ CADASTRADO E GRAVADO!\n\nO número de CTRC "${val}" já está lançado no sistema:\n• Data: ${fmtDate(duplicate.date)}\n• Placa: ${duplicate.plate || '-'}\n• Motorista: ${duplicate.driver_name || '-'}\n• Destino: ${duplicate.destination || '-'}\n\nO sistema NÃO permite digitar nem gravar CTRC duplicado.\nO campo foi limpo para que você digite o número correto.`);
          ctrcEl.value = '';
          ctrcEl.style.borderColor = '';
          ctrcEl.style.backgroundColor = '';
          ctrcEl.style.color = '';
          ctrcEl.setCustomValidity('');
          setTimeout(() => ctrcEl.focus(), 50);
        }
        return false;
      } else {
        ctrcEl.setCustomValidity('');
        ctrcEl.style.borderColor = '';
        ctrcEl.style.backgroundColor = '';
        ctrcEl.style.color = '';
        if(q('#msg').textContent.includes('CTRC')) showMessage('');
        return true;
      }
    }

    q('#ctrc').addEventListener('input', () => checkCtrcDuplicity(false));
    q('#ctrc').addEventListener('blur', () => {
      if (q('#ctrc').value.trim()) checkCtrcDuplicity(true);
    });

    function startEdit(item){
      q('#frete-id').value = item.id;

      for(const el of q('#f').elements){
        if(!el.name || el.name === 'id') continue;
        if(item[el.name] !== undefined && item[el.name] !== null){
          el.value = item[el.name];
        }
      }

      q('#form-title').textContent = 'Editar lançamento de frete';
      q('#save-button').textContent = 'Salvar alterações';
      q('#cancel-edit').style.display = 'inline-block';
      showMessage('Editando o lançamento selecionado.');
      window.scrollTo({top:0,behavior:'smooth'});
    }

    window.editFrete = function(id){
      const item = fretes.find(x => String(x.id) === String(id));
      if(item) startEdit(item);
    };

    function cancelEditFrete(){
      q('#f').reset();
      q('#frete-id').value = '';
      q('#ctrc').setCustomValidity('');
      q('#ctrc').style.borderColor = '';
      q('#ctrc').style.backgroundColor = '';
      q('#ctrc').style.color = '';
      q('#form-title').textContent = 'Lançamento de frete';
      q('#save-button').textContent = 'Salvar lançamento';
      q('#cancel-edit').style.display = 'none';
      showMessage('');
    }

    q('#cancel-edit').onclick = cancelEditFrete;

    window.deleteFrete = async function(id){
      const item = fretes.find(x => String(x.id) === String(id));
      if(!item) return;

      const descricao =
        (item.date || '') + ' - ' +
        (item.driver_name || 'sem motorista') + ' - ' +
        (item.destination || 'sem destino');

      if(!await confirm('Tem certeza que deseja excluir este frete?\n\n' + descricao)) return;

      try{
        const s = JSON.parse(sessionStorage.getItem('nj_session')||'null');
        const response = await fetch(
          '/api/freight_entries/' + encodeURIComponent(id),
          {method:'DELETE', headers: s ? {'X-User-Id':s.id, 'X-User-Name':encodeURIComponent(s.name)} : {}}
        );

        const data = await response.json().catch(() => ({}));
        if(!response.ok){
          throw new Error(data.error || 'Não foi possível excluir o frete.');
        }

        if(String(q('#frete-id').value) === String(id)){
          cancelEditFrete();
        }

        showMessage('Frete excluído com sucesso.');
        await load();
      }catch(error){
        showMessage(error.message, true);
      }
    };

    q('#f').onsubmit = async e => {
      e.preventDefault();

      const ctrcEl = q('#ctrc');
      const val = ctrcEl.value.trim().toUpperCase();
      const id = q('#frete-id').value;

      if(!val){
        alert('Por favor, digite o número do CTRC.');
        ctrcEl.focus();
        return;
      }

      // Validação local imediata
      if(!checkCtrcDuplicity(true)){
        return;
      }

      // Validação em tempo real direto no banco de dados via API
      try {
        const checkRes = await fetch(`/api/check-ctrc?ctrc=${encodeURIComponent(val)}&excludeId=${encodeURIComponent(id)}`);
        if (checkRes.ok) {
          const chk = await checkRes.json();
          if (chk.exists) {
            const entry = chk.entry;
            alert(`❌ CTRC JÁ CADASTRADO E GRAVADO NO BANCO DE DADOS!\n\nO CTRC "${val}" já está gravado no sistema:\n• Data: ${fmtDate(entry.date)}\n• Placa: ${entry.plate || '-'}\n• Motorista: ${entry.driver_name || '-'}\n• Destino: ${entry.destination || '-'}\n\nO sistema não permite gravar outro frete com este mesmo CTRC.\nO campo foi limpo para nova digitação.`);
            ctrcEl.value = '';
            ctrcEl.focus();
            showMessage(`O CTRC "${val}" já está gravado no banco de dados e foi rejeitado.`, true);
            return;
          }
        }
      } catch (err) {
        console.warn('Verificação online de CTRC falhou:', err);
      }

      const data = Object.fromEntries(new FormData(e.target));
      delete data.id;

      try{
        const s = JSON.parse(sessionStorage.getItem('nj_session')||'null');
        const response = await fetch(
          '/api/freight_entries' + (id ? '/' + encodeURIComponent(id) : ''),
          {
            method: id ? 'PUT' : 'POST',
            headers: {'Content-Type':'application/json', ...(s ? {'X-User-Id':s.id, 'X-User-Name':encodeURIComponent(s.name)} : {})},
            body: JSON.stringify(data)
          }
        );

        const result = await response.json().catch(() => ({}));
        if(!response.ok){
          throw new Error(
            result.error ||
            (id ? 'Não foi possível atualizar o frete.' : 'Não foi possível salvar o frete.')
          );
        }

        cancelEditFrete();
        showMessage(id ? 'Frete atualizado com sucesso!' : 'Frete salvo com sucesso!');
        await load();
        q('input[name="date"]').focus();
      }catch(error){
        showMessage(error.message, true);
        if (error.message.includes('CTRC')) {
          alert('❌ ERRO AO GRAVAR:\n\n' + error.message);
          ctrcEl.value = '';
          ctrcEl.focus();
        }
      }
    };

    // Navegação com a tecla Enter entre os campos até o botão Salvar
    const enterNavSelectors = [
      'input[name="date"]',
      'input[name="ctrc"]',
      'select[name="vehicle_id"]',
      'select[name="driver_id"]',
      'select[name="client_id"]',
      'input[name="destination"]',
      'input[name="freight"]',
      'input[name="tolls"]',
      'input[name="inss"]',
      'input[name="sest_senat"]',
      'input[name="irrf"]',
      '#save-button'
    ];

    q('#f').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        const target = e.target;
        if (target.id === 'save-button') {
          return;
        }

        // Se estiver no campo CTRC, valida antes de avançar
        if (target.id === 'ctrc') {
          const val = target.value.trim().toUpperCase();
          if (!val) {
            e.preventDefault();
            showMessage('Por favor, informe o número do CTRC.', true);
            target.reportValidity();
            return;
          }
          if (!checkCtrcDuplicity(true)) {
            e.preventDefault();
            return;
          }
        }

        const currentIndex = enterNavSelectors.findIndex(sel => target.matches(sel));
        if (currentIndex !== -1 && currentIndex < enterNavSelectors.length - 1) {
          e.preventDefault();
          const nextEl = q(enterNavSelectors[currentIndex + 1]);
          if (nextEl) {
            nextEl.focus();
            if (typeof nextEl.select === 'function' && nextEl.type !== 'date') {
              nextEl.select();
            }
          }
        }
      }
    });

    Promise.all([
      l('drivers','#d','name'),
      l('vehicles','#v','plate'),
      l('clients','#c','name'),
      load()
    ]).catch(error => showMessage(error.message, true));
  </script>
<script src="timeout.js"></script></body>
</html>
