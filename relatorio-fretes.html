<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Relatório de Fretes</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body{background:#f6f8fb}
    .report{padding:36px;max-width:1500px;margin:0 auto}
    .filters{display:grid;grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));gap:14px;background:#fff;padding:20px;border:1px solid #e5e7eb;border-radius:10px;margin:20px 0;align-items:end}
    .filters label{display:grid;gap:6px;font-weight:600;font-size:13px;color:#374151}
    .filters input,.filters select{border:1px solid #d6dbe2;border-radius:8px;padding:9px 12px;font-size:13px;color:#1f2937;background:#fff;width:100%;box-sizing:border-box}
    .filters button{padding:10px 14px;height:40px;box-sizing:border-box;white-space:nowrap}
    .table-wrap{background:#fff;border:1px solid #e5e7eb;border-radius:10px;overflow-x:auto}
    table{width:100%;border-collapse:collapse}
    th,td{padding:14px;text-align:left;border-bottom:1px solid #e5e7eb;font-size:13px}
    th{background:#fafbfc;color:#475569;font-weight:700;white-space:nowrap}
    @page{size:A4 landscape;margin:12mm}
    @media print{
      body{background:#fff}
      body>*{visibility:hidden}
      .report,.report *{visibility:visible}
      .report{position:absolute;left:0;top:0;width:100%;max-width:none;padding:0}
      .filters,.eyebrow,.back-link{display:none!important}
      .stats-cards{display:none!important}
      .table-wrap{border:0}
      th,td{font-size:10px;padding:6px}
    }
    .stats{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;margin:20px 0}
    .stat{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:20px}
    .stat span{color:#64748b;font-size:13px;display:block}
    .stat strong{display:block;font-size:22px;font-weight:800;color:#102a43;margin-top:6px}
    .stat.green strong{color:#187444}
    .stat-orange strong{color:#a15d00}
    .stat.red strong{color:#b42318}
    @media(max-width:800px){
      .stats{grid-template-columns:1fr 1fr 1fr}
      .report{padding:18px}
    }
  </style>
</head>
<body>
  <main class="report">
    <a href="index.html" class="button button-secondary back-link" style="display:inline-block; margin-bottom:24px; text-decoration:none; font-weight:500; font-size:14px; padding:10px 16px;">&larr; Voltar para a página inicial</a>
    <p class="eyebrow">RELATÓRIOS</p>
    <h1>Relatório de fretes</h1>

    <section class="filters">
      <label>Motorista
        <select id="driver"><option value="">Todos</option></select>
      </label>
      <label>Cliente
        <select id="client"><option value="">Todos</option></select>
      </label>
      <label>Destino
        <input id="destination" placeholder="Filtrar destino">
      </label>
      <label>CTRC
        <input id="ctrc" placeholder="Buscar por CTRC">
      </label>
      <label>De
        <input id="start" type="date">
      </label>
      <label>Até
        <input id="end" type="date">
      </label>
      <button class="button button-secondary" id="clear" type="button">Limpar</button>
      <button class="button button-primary" onclick="window.print()" type="button">Imprimir / PDF</button>
    </section>

    <section class="stats">
      <article class="stat green">
        <span>Total Frete</span>
        <strong id="s-freight">R$ 0,00</strong>
      </article>
      <article class="stat-orange">
        <span>Total Comissão (15%)</span>
        <strong id="s-commission">R$ 0,00</strong>
      </article>
      <article class="stat">
        <span>Total Pedágios</span>
        <strong id="s-tolls">R$ 0,00</strong>
      </article>
      <article class="stat red">
        <span>SEST/SENAT</span>
        <strong id="s-sest">R$ 0,00</strong>
      </article>
      <article class="stat red">
        <span>IRRF</span>
        <strong id="s-irrf">R$ 0,00</strong>
      </article>
      <article class="stat red">
        <span>INSS</span>
        <strong id="s-inss">R$ 0,00</strong>
      </article>
    </section>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Data</th>
            <th>CTRC</th>
            <th>Placa</th>
            <th>Motorista</th>
            <th>Cliente</th>
            <th>Destino</th>
            <th>Frete</th>
            <th>Comissão</th>
            <th>Pedágios</th>
            <th>INSS</th>
            <th>SEST/SENAT</th>
            <th>IRRF</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>

  <script>
    const q = s => document.querySelector(s);
    let all = [];

    const m = v => 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    function esc(value){
      return String(value ?? '').replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

    function fmtDate(v){
      const s = String(v || '').slice(0, 10);
      if(!s) return '-';
      const [y, mo, d] = s.split('-');
      return `${d}/${mo}/${y}`;
    }

    function render(){
      const d = q('#driver').value;
      const c = q('#client').value;
      const x = q('#destination').value.toLowerCase().trim();
      const ct = (q('#ctrc').value || '').toLowerCase().trim();
      const a = q('#start').value;
      const b = q('#end').value;

      const list = all.filter(r =>
        (!d || r.driver_id === d) &&
        (!c || r.client_id === c) &&
        (!x || String(r.destination || '').toLowerCase().includes(x)) &&
        (!ct || String(r.ctrc || '').toLowerCase().includes(ct)) &&
        (!a || r.date >= a) &&
        (!b || r.date <= b)
      );

      const sf = list.reduce((s, r) => s + Number(r.freight || 0), 0);
      const st = list.reduce((s, r) => s + Number(r.tolls || 0), 0);
      const ss = list.reduce((s, r) => s + Number(r.sest_senat || 0), 0);
      const si = list.reduce((s, r) => s + Number(r.irrf || 0), 0);
      const sn = list.reduce((s, r) => s + Number(r.inss || 0), 0);

      q('#s-freight').textContent = m(sf);
      q('#s-commission').textContent = m(sf * 0.15);
      q('#s-tolls').textContent = m(st);
      q('#s-sest').textContent = m(ss);
      q('#s-irrf').textContent = m(si);
      q('#s-inss').textContent = m(sn);

      if (list.length === 0) {
        q('#rows').innerHTML = '<tr><td colspan="12" style="text-align:center;padding:24px;color:#6b7280;">Nenhum frete encontrado para os filtros selecionados.</td></tr>';
        return;
      }

      q('#rows').innerHTML = list.map(r => `
        <tr>
          <td>${fmtDate(r.date)}</td>
          <td><strong>${esc(r.ctrc || '-')}</strong></td>
          <td>${esc(r.plate || '-')}</td>
          <td>${esc(r.driver_name || '-')}</td>
          <td>${esc(r.client_name || '-')}</td>
          <td>${esc(r.destination || '-')}</td>
          <td>${m(r.freight)}</td>
          <td>${m(Number(r.freight || 0) * 0.15)}</td>
          <td>${m(r.tolls)}</td>
          <td>${m(r.inss)}</td>
          <td>${m(r.sest_senat)}</td>
          <td>${m(r.irrf)}</td>
        </tr>
      `).join('');
    }

    const _n = new Date(), _e = new Date(_n), _s = new Date(_n);
    _s.setDate(_s.getDate() - 30);
    q('#start').value = _s.toISOString().substring(0, 10);
    q('#end').value = _e.toISOString().substring(0, 10);

    fetch('/api/freight_entries')
      .then(r => r.json())
      .then(a => {
        all = a;
        for (let [id, n] of new Map(a.map(x => [x.driver_id, x.driver_name]))) {
          if (id && n) q('#driver').innerHTML += `<option value="${esc(id)}">${esc(n)}</option>`;
        }
        for (let [id, n] of new Map(a.map(x => [x.client_id, x.client_name]))) {
          if (id && n) q('#client').innerHTML += `<option value="${esc(id)}">${esc(n)}</option>`;
        }
        render();
      });

    document.querySelectorAll('input,select').forEach(e => e.oninput = render);

    q('#clear').onclick = () => {
      document.querySelectorAll('.filters input,.filters select').forEach(x => x.value = '');
      q('#start').value = _s.toISOString().substring(0, 10);
      q('#end').value = _e.toISOString().substring(0, 10);
      render();
    };
  </script>
  <script src="timeout.js"></script>
</body>
</html>
