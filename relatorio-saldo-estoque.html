<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Relatório de Saldo de Estoque</title><link rel="stylesheet" href="styles.css"><style>body{background:#f6f8fb;margin:0}.topbar{position:sticky;top:0;z-index:1000;background:#fff;border-bottom:1px solid #e5e7eb;padding:12px 36px;display:flex;justify-content:flex-start;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.06)}.topbar a{display:inline-flex;align-items:center;text-decoration:none;padding:9px 14px;border-radius:7px;font-weight:700;background:#eef2f6;color:#1f2937}.report{padding:48px 36px;max-width:none;margin:0 auto}.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;background:#fff;padding:20px;border:1px solid #e5e7eb;border-radius:10px;margin:24px 0}.table-wrap{background:#fff;border:1px solid #e5e7eb;border-radius:10px;overflow:hidden}table{width:100%;border-collapse:collapse}th,td{padding:14px;text-align:left;border-bottom:1px solid #e5e7eb;font-size:13px}@page{size:A4 portrait;margin:12mm}@media print{body{background:#fff}body>*{visibility:hidden}.report,.report *{visibility:visible}.report{position:absolute;left:0;top:0;width:100%;max-width:none;padding:0}.filters,.eyebrow,.topbar{display:none!important}.stats{display:none!important}.table-wrap{border:0}th,td{font-size:10px;padding:7px}}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:24px 0}.stat{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:20px}.stat span{color:#64748b;font-size:13px;display:block}.stat strong{display:block;font-size:22px;font-weight:800;color:#102a43;margin-top:6px}.stat.green strong{color:#187444}.stat.orange strong{color:#a15d00}.stat.red strong{color:#b42318}@media(max-width:1000px){.filters{grid-template-columns:repeat(2,1fr)}}@media(max-width:800px){.stats{grid-template-columns:1fr}.filters{grid-template-columns:1fr}}</style><body><nav class="topbar"><a href="index.html">&larr; Voltar para a página inicial</a></nav><main class="report"><p class="eyebrow">RELATÓRIOS</p><h1>Relatório de Saldo de Estoque</h1><section class="filters"><label>Nome do Material<input id="name" placeholder="Buscar por nome..."></label><label>Status<select id="status"><option value="">Todos</option><option value="normal">Normal</option><option value="low">Abaixo do mínimo</option><option value="empty">Sem estoque</option></select></label><button class="button button-secondary" id="clear" style="align-self:end">Limpar</button><button class="button button-primary" onclick="window.print()" style="align-self:end">Imprimir / PDF</button></section><section class="stats"><article class="stat"><span>Total de Materiais Cadastrados</span><strong id="s-total">0</strong></article><article class="stat green"><span>Itens em Estoque (Quantidade)</span><strong id="s-qty">0.00</strong></article><article class="stat red"><span>Materiais Abaixo do Mínimo</span><strong id="s-low">0</strong></article></section><div class="table-wrap"><table><thead><tr><th>Material</th><th>Unidade</th><th>Estoque Mínimo</th><th>Estoque Atual</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>const q=s=>document.querySelector(s);let all=[];const num=v=>Number(v||0).toFixed(2);function getStatus(r){let c=Number(r.current_stock||0),m=Number(r.min_stock||0);if(c<=0)return{key:'empty',label:'Sem estoque',color:'#991b1b',bg:'#fee2e2'};if(c<m)return{key:'low',label:'Abaixo do mínimo',color:'#a15d00',bg:'#ffedd5'};return{key:'normal',label:'Normal',color:'#166534',bg:'#dcfce7'}}function render(){let n=q('#name').value.toLowerCase(),st=q('#status').value;let list=all.filter(r=>{let s=getStatus(r);return(!n||r.name.toLowerCase().includes(n))&&(!st||s.key===st)});let tQty=list.reduce((s,r)=>s+Number(r.current_stock||0),0);let tLow=list.filter(r=>getStatus(r).key==='low'||getStatus(r).key==='empty').length;q('#s-total').textContent=list.length;q('#s-qty').textContent=num(tQty);q('#s-low').textContent=tLow;q('#rows').innerHTML=list.map(r=>{let s=getStatus(r);return'<tr><td><strong>'+r.name+'</strong></td><td>'+(r.unit||'-')+'</td><td>'+num(r.min_stock)+'</td><td><strong>'+num(r.current_stock)+'</strong></td><td><span style="display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;background:'+s.bg+';color:'+s.color+'">'+s.label+'</span></td></tr>'}).join('')}fetch('/api/materials').then(r=>r.json()).then(a=>{all=a;render()});document.querySelectorAll('input,select').forEach(e=>e.oninput=render);q('#clear').onclick=()=>{document.querySelectorAll('.filters input,.filters select').forEach(x=>x.value='');render()}</script><script src="timeout.js"></script></body></html>
