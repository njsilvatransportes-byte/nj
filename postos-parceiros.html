<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Postos Parceiros</title><link rel="stylesheet" href="styles.css"><style>body{background:#f6f8fb}.topbar{position:sticky;top:0;z-index:1000;background:#fff;border-bottom:1px solid #e5e7eb;padding:12px 36px;display:flex;justify-content:flex-start;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.06)}.topbar a{display:inline-flex;align-items:center;text-decoration:none;padding:9px 14px;border-radius:7px;font-weight:700;background:#eef2f6;color:#1f2937}.page{padding:36px}.card{max-width:none;padding:28px}.form-stack{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.form-stack button{grid-column:1;justify-self:start;padding:9px 14px}@media(max-width:700px){.form-stack{grid-template-columns:1fr}.topbar{padding:10px 16px}}</style><body><nav class="topbar"><a href="index.html">&larr; Voltar para a página inicial</a></nav><main class="page"><section class="card"><p class="eyebrow">CADASTROS</p><h2>Posto parceiro</h2><form id="f" class="form-stack"><label>Nome<input name="name" required></label><label>CNPJ<input name="cnpj"></label><label>Telefone<input name="phone"></label><label>CEP<input name="zip_code"></label><label>Endereço<input name="address"></label><label>Cidade<input name="city"></label><label>UF<input name="state" maxlength="2"></label><button class="button button-primary">Salvar posto</button></form><h2>Postos cadastrados</h2><table><thead><tr><th>Posto</th><th>CNPJ</th><th>Telefone</th><th>Cidade/UF</th><th></th></tr></thead><tbody id="list"></tbody></table></section></main><script>const q=s=>document.querySelector(s);let postos=[];async function load(){postos=await fetch('/api/partner_stations').then(r=>r.json());q('#list').innerHTML=postos.map(x=>'<tr><td>'+x.name+'</td><td>'+x.cnpj+'</td><td>'+x.phone+'</td><td>'+x.city+'/'+x.state+'</td><td><button class="table-action" onclick="editPosto(\''+x.id+'\')">Editar</button></td></tr>').join('')}function editPosto(id){let item=postos.find(x=>String(x.id)===String(id));if(!item)return;let f=q('#f');f.elements['name'].value=item.name||'';f.elements['cnpj'].value=item.cnpj||'';f.elements['phone'].value=item.phone||'';f.elements['zip_code'].value=item.zip_code||'';f.elements['address'].value=item.address||'';f.elements['city'].value=item.city||'';f.elements['state'].value=item.state||'';if(!q('#record-id'))f.insertAdjacentHTML('beforeend','<input type="hidden" id="record-id" name="id" value="">');q('#record-id').value=item.id;window.scrollTo(0,0)}q('#f').onsubmit=async e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target));let id=data.id;if(id)delete data.id;const s=JSON.parse(localStorage.getItem('nj_session')||'null');let r=await fetch('/api/partner_stations'+(id?'/'+id:''),{method:id?'PUT':'POST',headers:{'Content-Type':'application/json',...(s?{'X-User-Id':s.id,'X-User-Name':encodeURIComponent(s.name)}:{})},body:JSON.stringify(data)});if(r.ok){alert('Posto salvo com sucesso!');e.target.reset();if(q('#record-id'))q('#record-id').value='';load()}};q('#f').addEventListener('input', async e => { if(e.target.name==='cnpj'){let v=e.target.value.replace(/\D/g,'').slice(0,14);e.target.value=v.replace(/^(\d{2})(\d)/,'$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d)/,'.$1/$2').replace(/(\d{4})(\d)/,'$1-$2')} if(e.target.name==='phone'){let v=e.target.value.replace(/\D/g,'').slice(0,11);e.target.value=v.length>10?v.replace(/^(\d{2})(\d{5})(\d{4})/,'($1) $2-$3'):v.length>2?v.replace(/^(\d{2})(\d{0,4})(\d{0,4})/,'($1) $2-$3').replace(/-$/,''):v.length>0?v.replace(/^(\d{0,2})/,'($1'):''} if(e.target.name==='zip_code'){let v=e.target.value.replace(/\D/g,'').slice(0,8);e.target.value=v.replace(/^(\d{5})(\d)/,'$1-$2');if(e.target.value.length===9){try{let r=await fetch('https://viacep.com.br/ws/'+v+'/json/');let d=await r.json();if(!d.erro){let f=e.target.closest('form');if(f.elements['address'])f.elements['address'].value=d.logradouro||'';if(f.elements['city'])f.elements['city'].value=d.localidade||'';if(f.elements['state'])f.elements['state'].value=d.uf||'';if(f.elements['address'])f.elements['address'].focus();}}catch(err){}}} });load()</script><script src="timeout.js"></script></body></html>
