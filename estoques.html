<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Movimentação de Estoque</title><link rel="stylesheet" href="styles.css"><style>body{background:#f6f8fb}.topbar{position:sticky;top:0;z-index:1000;background:#fff;border-bottom:1px solid #e5e7eb;padding:12px 36px;display:flex;justify-content:flex-start;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.06)}.topbar a{display:inline-flex;align-items:center;text-decoration:none;padding:9px 14px;border-radius:7px;font-weight:700;background:#eef2f6;color:#1f2937}.page{padding:36px}.card{max-width:none;padding:28px}.form-stack{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.form-stack button{grid-column:1;justify-self:start;padding:9px 14px}@media(max-width:700px){.form-stack{grid-template-columns:1fr}.topbar{padding:10px 16px}} .dash-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px} .kpi-card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:20px 22px;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s} .kpi-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.08)} .kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;border-radius:12px 12px 0 0} .kpi-card.blue::before{background:linear-gradient(90deg,#1261a0,#38bdf8)} .kpi-card.green::before{background:linear-gradient(90deg,#16a34a,#4ade80)} .kpi-card.orange::before{background:linear-gradient(90deg,#f08a24,#fbbf24)} .kpi-card.red::before{background:linear-gradient(90deg,#dc2626,#f87171)} .kpi-label{font-size:12px;color:#6b7280;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px} .kpi-value{font-size:26px;font-weight:800;color:#102a43;line-height:1} @media(max-width:900px){.dash-kpis{grid-template-columns:repeat(2,1fr)}} @media(max-width:600px){.dash-kpis{grid-template-columns:1fr}}</style><body><nav class="topbar"><a href="index.html">&larr; Voltar para a página inicial</a></nav><main class="page"><div class="dash-kpis"><div class="kpi-card blue"><div class="kpi-label">Materiais Cadastrados</div><div class="kpi-value" id="kpi-total-materials">0</div></div><div class="kpi-card red"><div class="kpi-label">Abaixo do Estoque Mín.</div><div class="kpi-value" id="kpi-low-stock">0</div></div><div class="kpi-card green"><div class="kpi-label">Entradas no Mês</div><div class="kpi-value" id="kpi-in-month">0</div></div><div class="kpi-card orange"><div class="kpi-label">Saídas no Mês</div><div class="kpi-value" id="kpi-out-month">0</div></div></div><section class="card"><p class="eyebrow">LANÇAMENTOS</p><h2>Movimentação de Estoque</h2><form id="f" class="form-stack"><label>Tipo de Movimentação<select name="type" id="sel-type" required><option value="Entrada">Entrada</option><option value="Saída">Saída</option></select></label><label>Data<input type="date" name="date" required></label><label>Material<select name="material_id" required id="sel-material"><option value="">Selecione...</option></select></label><label>Quantidade<input type="number" step="0.01" name="quantity" required></label><label id="lbl-nf">Nº Nota Fiscal<input name="invoice_number" oninput="this.value = this.value.toUpperCase()"></label><label id="lbl-supplier">Fornecedor<select name="supplier_id" id="sel-supplier"><option value="">Selecione...</option></select></label><label id="lbl-value">Valor Total (R$)<input type="number" step="0.01" name="value"></label><label id="lbl-vehicle" style="display:none;">Veículo (Centro de Custo)<select name="vehicle_id" id="sel-vehicle"><option value="">Nenhum</option></select></label><button class="button button-primary">Salvar movimentação</button></form><h2>Histórico de Movimentações</h2><table><thead><tr><th>Data</th><th>Tipo</th><th>Material</th><th>Qtd</th><th>NF</th><th>Fornecedor</th><th>Valor</th><th>Veículo</th><th></th></tr></thead><tbody id="list"></tbody></table></section></main><script>const q=s=>document.querySelector(s);let items=[],materials=[],suppliers=[],vehicles=[];function updateKPIs(){q('#kpi-total-materials').textContent=materials.length;q('#kpi-low-stock').textContent=materials.filter(m=>Number(m.current_stock||0)<Number(m.min_stock||0)).length;const d=new Date();const m=d.getMonth()+1;const y=d.getFullYear();const c=items.filter(x=>{const dx=new Date(x.date);return dx.getMonth()+1===m&&dx.getFullYear()===y});q('#kpi-in-month').textContent=c.filter(x=>x.type==='Entrada').length;q('#kpi-out-month').textContent=c.filter(x=>x.type==='Saída').length;}async function loadData(){[materials,suppliers,vehicles]=await Promise.all([fetch('/api/materials').then(r=>r.json()),fetch('/api/suppliers').then(r=>r.json()),fetch('/api/vehicles').then(r=>r.json())]);q('#sel-material').innerHTML='<option value="">Selecione...</option>'+materials.map(x=>'<option value="'+x.id+'">'+x.name+' (Estoque: '+(x.current_stock||'0')+' '+(x.unit||'')+')</option>').join('');q('#sel-supplier').innerHTML='<option value="">Selecione...</option>'+suppliers.map(x=>'<option value="'+x.id+'">'+x.name+' ('+(x.document||'')+')</option>').join('');q('#sel-vehicle').innerHTML='<option value="">Nenhum</option>'+vehicles.map(x=>'<option value="'+x.id+'">'+x.plate+' - '+x.model+'</option>').join('');updateKPIs();load()}async function load(){items=await fetch('/api/stock_movements').then(r=>r.json());q('#list').innerHTML=items.map(x=>'<tr><td>'+x.date.split('T')[0].split('-').reverse().join('/')+'</td><td>'+x.type+'</td><td>'+(x.material_name||'-')+'</td><td>'+x.quantity+'</td><td>'+(x.invoice_number||'-')+'</td><td>'+(x.supplier_name||'-')+'</td><td>'+(x.value? 'R$ '+parseFloat(x.value).toFixed(2):'-')+'</td><td>'+(x.vehicle_plate||'-')+'</td><td><button class="table-action" onclick="deleteItem(\''+x.id+'\')">Excluir</button></td></tr>').join('');updateKPIs();}async function deleteItem(id){if(!await confirm('Tem certeza?'))return;const s=JSON.parse(sessionStorage.getItem('nj_session')||'null');let r=await fetch('/api/stock_movements/'+id,{method:'DELETE',headers:(s?{'X-User-Id':s.id,'X-User-Name':encodeURIComponent(s.name)}:{})});if(r.ok)loadData()}q('#f').onsubmit=async e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target));for(let k in data)if(data[k]==='')delete data[k];if(data.type==='Saída'){let m=materials.find(x=>x.id===data.material_id);if(m&&Number(data.quantity)>Number(m.current_stock||0)){alert('Quantidade insuficiente em estoque para realizar esta saída. Estoque atual: '+(m.current_stock||0));return;}}const s=JSON.parse(sessionStorage.getItem('nj_session')||'null');let r=await fetch('/api/stock_movements',{method:'POST',headers:{'Content-Type':'application/json',...(s?{'X-User-Id':s.id,'X-User-Name':encodeURIComponent(s.name)}:{})},body:JSON.stringify(data)});if(r.ok){alert('Movimentação salva com sucesso!');e.target.reset();q('input[name="date"]').value=new Date().toISOString().split('T')[0];q('#sel-type').dispatchEvent(new Event('change'));loadData()}else{let err=await r.json();alert('Erro: '+(err.error||'Falha ao salvar'));}};q('input[name="date"]').value=new Date().toISOString().split('T')[0];q('#sel-type').addEventListener('change', e => { let isSaida = e.target.value === 'Saída'; q('#lbl-vehicle').style.display = isSaida ? 'block' : 'none'; q('#lbl-nf').style.display = isSaida ? 'none' : 'block'; q('#lbl-supplier').style.display = isSaida ? 'none' : 'block'; q('#lbl-value').style.display = isSaida ? 'none' : 'block'; if(isSaida){ q('input[name="invoice_number"]').value = ''; q('#sel-supplier').value = ''; q('input[name="value"]').value = ''; } else { q('#sel-vehicle').value = ''; } });loadData()</script><script src="timeout.js"></script></body></html>
