<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Movimentações</title><link rel="stylesheet" href="styles.css?v=2"><style>body{background:#f6f8fb;margin:0}.topbar{position:sticky;top:0;z-index:1000;background:#fff;border-bottom:1px solid #e5e7eb;padding:12px 36px;display:flex;justify-content:flex-start;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.06)}.topbar a{display:inline-flex;align-items:center;text-decoration:none;padding:9px 14px;border-radius:7px;font-weight:700;background:#eef2f6;color:#1f2937}.report{padding:48px 36px;max-width:none;margin:0 auto}.filters{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;background:#fff;padding:20px;border:1px solid #e5e7eb;border-radius:10px;margin:24px 0}.table-wrap{background:#fff;border:1px solid #e5e7eb;border-radius:10px;overflow:hidden}table{width:100%;border-collapse:collapse}th,td{padding:14px;text-align:left;border-bottom:1px solid #e5e7eb;font-size:13px}@page{size:A4 landscape;margin:12mm}@media print{body{background:#fff}body>*{visibility:hidden}.report,.report *{visibility:visible}.report{position:absolute;left:0;top:0;width:100%;max-width:none;padding:0}.filters,.eyebrow,.topbar{display:none!important}.stats{display:none!important}.table-wrap{border:0}th,td{font-size:10px;padding:7px}}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:24px 0}.stat{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:20px}.stat span{color:#64748b;font-size:13px;display:block}.stat strong{display:block;font-size:22px;font-weight:800;color:#102a43;margin-top:6px}.stat.green strong{color:#187444}.stat-orange strong{color:#a15d00}.stat.red strong{color:#b42318}@media(max-width:1000px){.filters{grid-template-columns:repeat(3,1fr)}}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}}</style><body><nav class="topbar"><a href="index.html">&larr; Voltar para a página inicial</a></nav><main class="report"><p class="eyebrow">RELATÓRIOS</p><h1>Movimentações</h1><section class="filters"><label>Tipo<select id="type"><option value="">Todos</option><option value="Entrada">Entrada</option><option value="Saída">Saída</option></select></label><label>Material<select id="material"><option value="">Todos</option></select></label><label>Veículo<select id="vehicle"><option value="">Todos</option></select></label><label>Fornecedor<select id="supplier"><option value="">Todos</option></select></label><label>De<input id="start" type="date"></label><label>Até<input id="end" type="date"></label><button class="button button-secondary" id="clear" style="grid-column: span 3;">Limpar</button><button class="button button-primary" onclick="window.print()" style="grid-column: span 3;">Imprimir / PDF</button></section><section class="stats"><article class="stat green"><span>Total Qtd. Entradas</span><strong id="s-qty-in">0.00</strong></article><article class="stat-orange"><span>Total Valor Entradas</span><strong id="s-val-in">R$ 0,00</strong></article><article class="stat red"><span>Total Qtd. Saídas</span><strong id="s-qty-out">0.00</strong></article></section><div class="table-wrap"><table><thead><tr><th>Data</th><th>Tipo</th><th>Material</th><th>Quantidade</th><th>NF</th><th>Fornecedor</th><th>Valor</th><th>Veículo (Destino)</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>const q=s=>document.querySelector(s);let all=[];const m=v=>'R$ '+Number(v||0).toFixed(2);const num=v=>Number(v||0).toFixed(2);function fmtDate(v){const s=String(v||'').slice(0,10);if(!s)return'-';const[y,mo,d]=s.split('-');return`${d}/${mo}/${y}`;}function render(){let t=q('#type').value,mat=q('#material').value,veh=q('#vehicle').value,sup=q('#supplier').value,a=q('#start').value,b=q('#end').value;let list=all.filter(r=>{let d = r.date ? r.date.substring(0,10) : '';return(!t||r.type===t)&&(!mat||r.material_id===mat)&&(!veh||r.vehicle_id===veh)&&(!sup||r.supplier_id===sup)&&(!a||d>=a)&&(!b||d<=b);});let qi=list.filter(r=>r.type==='Entrada').reduce((s,r)=>s+Number(r.quantity||0),0),vi=list.filter(r=>r.type==='Entrada').reduce((s,r)=>s+Number(r.value||0),0),qo=list.filter(r=>r.type==='Saída').reduce((s,r)=>s+Number(r.quantity||0),0);q('#s-qty-in').textContent=num(qi);q('#s-val-in').textContent=m(vi);q('#s-qty-out').textContent=num(qo);q('#rows').innerHTML=list.map(r=>'<tr><td>'+fmtDate(r.date)+'</td><td><span style="display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;'+(r.type==='Entrada'?'background:#dcfce7;color:#166534':'background:#fee2e2;color:#991b1b')+'">'+r.type+'</span></td><td>'+(r.material_name||'-')+'</td><td>'+r.quantity+'</td><td>'+(r.invoice_number||'-')+'</td><td>'+(r.supplier_name||'-')+'</td><td>'+(r.value?m(r.value):'-')+'</td><td>'+(r.vehicle_plate||'-')+'</td></tr>').join('')}let _n=new Date(),_e=new Date(_n),_s=new Date(_n);_s.setDate(_s.getDate()-30);q('#start').value=_s.toISOString().substring(0,10);q('#end').value=_e.toISOString().substring(0,10);fetch('/api/stock_movements').then(r=>r.json()).then(a=>{all=a;for(let [id,n] of new Map(a.map(x=>[x.material_id,x.material_name]).filter(x=>x[0])))q('#material').innerHTML+='<option value="'+id+'">'+n+'</option>';for(let [id,n] of new Map(a.map(x=>[x.vehicle_id,x.vehicle_plate]).filter(x=>x[0])))q('#vehicle').innerHTML+='<option value="'+id+'">'+n+'</option>';for(let [id,n] of new Map(a.map(x=>[x.supplier_id,x.supplier_name]).filter(x=>x[0])))q('#supplier').innerHTML+='<option value="'+id+'">'+n+'</option>';render()});document.querySelectorAll('input,select').forEach(e=>e.oninput=render);q('#clear').onclick=()=>{document.querySelectorAll('.filters input,.filters select').forEach(x=>x.value='');q('#start').value=_s.toISOString().substring(0,10);q('#end').value=_e.toISOString().substring(0,10);render()}</script><script src="timeout.js"></script></body></html>
