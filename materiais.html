<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Materiais</title><link rel="stylesheet" href="styles.css"><style>body{background:#f6f8fb}.topbar{position:sticky;top:0;z-index:1000;background:#fff;border-bottom:1px solid #e5e7eb;padding:12px 36px;display:flex;justify-content:flex-start;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.06)}.topbar a{display:inline-flex;align-items:center;text-decoration:none;padding:9px 14px;border-radius:7px;font-weight:700;background:#eef2f6;color:#1f2937}.page{padding:36px}.card{max-width:none;padding:28px}.form-stack{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.form-stack button{grid-column:1;justify-self:start;padding:9px 14px}@media(max-width:700px){.form-stack{grid-template-columns:1fr}.topbar{padding:10px 16px}}</style><body><nav class="topbar"><a href="index.html">&larr; Voltar para a página inicial</a></nav><main class="page"><section class="card"><p class="eyebrow">CADASTROS</p><h2>Materiais</h2><form id="f" class="form-stack" style="grid-template-columns: repeat(12, 1fr);"><label style="grid-column: span 6">Nome do material<input name="name" required oninput="this.value = this.value.toUpperCase()"></label><label style="grid-column: span 6">Descrição<input name="description" oninput="this.value = this.value.toUpperCase()"></label><label style="grid-column: span 4">Unidade de Medida<input name="unit" placeholder="Ex: UN, KG, L, CX" oninput="this.value = this.value.toUpperCase()"></label><label style="grid-column: span 4">Estoque Mínimo<input type="number" step="0.01" name="min_stock" value="0"></label><label style="grid-column: span 4">Status<select name="status"><option value="Ativo">Ativo</option><option value="Inativo">Inativo</option></select></label><button class="button button-primary">Salvar material</button></form><h2>Materiais cadastrados</h2><table><thead><tr><th>Material</th><th>Descrição</th><th>Unidade</th><th>Estoque Mín.</th><th>Status</th><th></th></tr></thead><tbody id="list"></tbody></table></section></main><script>const q=s=>document.querySelector(s);let items=[];async function load(){items=await fetch('/api/materials').then(r=>r.json());q('#list').innerHTML=items.map(x=>`<tr><td>${x.name}</td><td>${x.description||'-'}</td><td>${x.unit||'-'}</td><td>${x.min_stock||'0'}</td><td><span style="display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;${x.status==='Inativo'?'background:#fee2e2;color:#991b1b':'background:#dcfce7;color:#166534'}">${x.status||'Ativo'}</span></td><td><button class="table-action" onclick="editItem('${x.id}')">Editar</button></td></tr>`).join('')}function editItem(id){let item=items.find(x=>String(x.id)===String(id));if(!item)return;let f=q('#f');f.elements['name'].value=item.name||'';f.elements['description'].value=item.description||'';f.elements['unit'].value=item.unit||'';f.elements['min_stock'].value=item.min_stock||0; if(f.elements['status']) f.elements['status'].value=item.status||'Ativo';if(!q('#record-id'))f.insertAdjacentHTML('beforeend','<input type="hidden" id="record-id" name="id" value="">');q('#record-id').value=item.id;window.scrollTo(0,0)}q('#f').onsubmit=async e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target));let id=data.id;if(id)delete data.id;const s=JSON.parse(sessionStorage.getItem('nj_session')||'null');let r=await fetch('/api/materials'+(id?'/'+id:''),{method:id?'PUT':'POST',headers:{'Content-Type':'application/json',...(s?{'X-User-Id':s.id,'X-User-Name':encodeURIComponent(s.name)}:{})},body:JSON.stringify(data)});if(r.ok){alert('Material salvo com sucesso!');}else{let err=await r.json();alert(err.error||'Erro ao salvar');return;}
if(r.ok){e.target.reset();if(q('#record-id'))q('#record-id').value='';load()}};load()</script><script src="timeout.js"></script></body></html>
